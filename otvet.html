<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://functions.yandexcloud.net; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Ответы на обращения — ИИгры онлайн</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&family=Golos+Text:wght@400;600&display=swap">
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0B0A0E;color:#F4F4F6;font:400 15px/1.5 "Golos Text",system-ui,sans-serif;padding:16px}
main{max-width:720px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}input,button{min-height:44px;font-size:16px}h1{font:800 1.6rem Rubik,sans-serif;margin:0}h1 b{color:#E7BD52}a{color:#E7BD52}
.card{background:#16141B;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px}.muted{color:#B9B6C2;font-size:.85rem}
input{background:#0F0E13;color:#F4F4F6;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 10px;font:inherit;flex:1;min-width:0}
button{border:0;border-radius:10px;padding:9px 14px;font:600 .95rem inherit;background:linear-gradient(135deg,#FF4A55,#A3101C);color:#fff;cursor:pointer}
.row{display:flex;gap:8px}.rp{border-left:3px solid #E7BD52;padding:4px 10px;margin-top:8px}.st{display:inline-block;border-radius:999px;padding:1px 9px;background:#24222A;font-size:.8rem;font-weight:600}
</style></head><body><main><h1>Ответы на <b>обращения</b></h1>
<p class="muted">Здесь видны ответы команды «ИИгр онлайн» на ваши обращения, жалобы и заявки. Обращения, отправленные из этого браузера, подставляются сами.</p>
<div class="card"><div class="row"><input id="num" placeholder="Номер обращения" maxlength="20"><button id="go">Проверить</button></div></div>
<div id="list"></div></main>
<script>
const API="https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av",$=id=>document.getElementById(id),el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
const T=ts=>new Date(ts).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
let mine=[];try{mine=JSON.parse(localStorage.getItem("iigry-tickets")||"[]").filter(x=>/^[0-9a-z]{8,20}$/.test(x)).slice(-20)}catch(_){}
async function show(id){const c=el("div",null,"card");c.append(el("b","Обращение № "+id));$("list").prepend(c);
  try{const r=await fetch(API+"?a=ticket&id="+encodeURIComponent(id)),j=await r.json();if(!r.ok){c.append(el("p",j.error||"Не найдено","muted"));return}
    c.append(el("div",j.kind+" · ","muted"));c.lastChild.append(el("span",j.st,"st"));
    if(!j.replies.length)c.append(el("p","Ответа пока нет — команда обычно отвечает в течение дня.","muted"));
    j.replies.forEach(x=>{const d=el("div",null,"rp");d.append(el("div",x.by+", "+T(x.ts),"muted"),el("div",x.text));c.append(d)})}catch(_){c.append(el("p","Нет связи с сервером, попробуйте позже.","muted"))}}
$("go").onclick=()=>{const v=$("num").value.trim().toLowerCase();if(/^[0-9a-z]{8,20}$/.test(v))show(v)};
const h=(location.hash.match(/^#([0-9a-z]{8,20})$/)||[])[1];new Set([...mine,...(h?[h]:[])]).forEach(show);
</script></main><script>/* Счётчик посещений «ИИгр»: случайный номер устройства хранится только в этом браузере; без cookie и слежки на других сайтах. Команда сайта не считается. */
(function(){try{if(navigator.webdriver||localStorage.getItem("iigry-mod"))return;let d=localStorage.getItem("iigry-did");
 if(!/^[0-9a-f]{32}$/.test(d||"")){const a=new Uint8Array(16);crypto.getRandomValues(a);d=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");localStorage.setItem("iigry-did",d)}
 const go=()=>{if(document.visibilityState!=="visible")return;document.removeEventListener("visibilitychange",go);fetch("https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av?a=hit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({d}),keepalive:true}).catch(()=>{})};
 setTimeout(()=>{document.visibilityState==="visible"?go():document.addEventListener("visibilitychange",go)},2500)}catch(_){}})();
/* Технические работы: пока сайт обновляется, показываем понятное предупреждение и сами обновляем страницу, когда всё готово */
(function(){const API="https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av?a=status";let shown=null,was=false;
 function show(j){if(shown)return;const d=document.createElement("div");d.setAttribute("role","alertdialog");d.setAttribute("aria-live","assertive");
  d.style.cssText="position:fixed;inset:0;z-index:2147483000;background:rgba(11,10,14,.88);display:grid;place-items:center;padding:16px;font-family:Golos Text,system-ui,sans-serif";
  const c=document.createElement("div");c.style.cssText="max-width:440px;background:#16141B;border:1px solid #E7BD52;border-radius:16px;padding:22px;color:#F4F4F6;text-align:center;display:grid;gap:10px";
  const h=document.createElement("b");h.style.cssText="font:800 1.3rem Rubik,system-ui,sans-serif;color:#E7BD52";h.textContent="🛠 Идут технические работы";
  const p=document.createElement("p");p.style.margin="0";const left=Math.max(1,Math.round((j.until-Date.now())/60000));p.textContent=(j.text||"Сайт обновляется — добавляем новое.")+" Обычно это пара минут (не дольше "+left+" мин). Страница обновится сама, когда всё будет готово.";
  const b=document.createElement("button");b.type="button";b.textContent="Понятно, подожду";b.style.cssText="border:0;border-radius:10px;padding:10px 16px;font:700 1rem inherit;background:linear-gradient(135deg,#FF4A55,#A3101C);color:#fff;cursor:pointer;justify-self:center";
  b.onclick=()=>{d.remove();shown=null;bar()};c.append(h,p,b);d.append(c);document.body.append(d);shown=d}
 function bar(){if(document.getElementById("iigry-maint-bar"))return;const s=document.createElement("div");s.id="iigry-maint-bar";s.textContent="🛠 Идут технические работы — возможны недолгие сбои";s.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:2147482999;background:#E7BD52;color:#1A1306;font:700 .9rem Golos Text,system-ui,sans-serif;text-align:center;padding:6px";document.body.append(s)}
 async function check(){try{const j=await (await fetch(API,{cache:"no-store"})).json();
   if(j.maint){was=true;if(!document.getElementById("iigry-maint-bar"))show(j)}else if(was){location.reload()}}catch(_){} }
 check();setInterval(check,20000)})();
</script><script id="iigry-nav-js">/* Панель навигации «ИИгр»: назад, главная, игры, мастерская, кабинет; в играх — возврат в меню игры. На телефоне — крупные значки с подписями, как в приложениях */
(function(){if(document.getElementById("iigry-nav"))return;const P=location.pathname,inG=/\/games\//.test(P),base=inG?"../":"./",here=P.replace(/^.*\//,"")||"index.html";
 const st=document.createElement("style");st.textContent="#iigry-nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;box-sizing:border-box;background:rgba(11,10,14,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.1)}#iigry-nav::-webkit-scrollbar{display:none}"+
  "#iigry-nav a,#iigry-nav button{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.14);background:#16141B;color:#F4F4F6;border-radius:999px;padding:0 14px;min-height:38px;font:600 13px/1.2 'Golos Text',system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}"+
  "#iigry-nav a[aria-current=page]{border-color:#E7BD52;color:#E7BD52}#iigry-nav .gm{border-color:rgba(231,189,82,.6)}#iigry-nav a:focus-visible,#iigry-nav button:focus-visible{outline:2px solid #E7BD52;outline-offset:2px}#iigry-nav .s{display:none}"+
  "@media(max-width:600px){#iigry-nav{gap:2px;padding:4px 4px;justify-content:space-between}#iigry-nav a,#iigry-nav button{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:2px;border:0;background:transparent;border-radius:12px;padding:4px 2px;min-height:50px;font-size:10.5px;color:#C9C6D2}"+
  "#iigry-nav .i{font-size:20px;line-height:1}#iigry-nav .l{display:none}#iigry-nav .s{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}#iigry-nav a[aria-current=page]{background:rgba(231,189,82,.14)}#iigry-nav .gm{background:rgba(231,189,82,.1);color:#E7BD52}#iigry-nav a:active,#iigry-nav button:active{background:rgba(255,255,255,.08)}}";
 document.head.append(st);const n=document.createElement("nav");n.id="iigry-nav";n.setAttribute("aria-label","Навигация по сайту");
 const fill=(el,i,l,s)=>{const a=document.createElement("span"),b=document.createElement("span"),c=document.createElement("span");a.className="i";a.textContent=i;a.setAttribute("aria-hidden","true");b.className="l";b.textContent=l;c.className="s";c.textContent=s;c.setAttribute("aria-hidden","true");el.append(a,b,c);el.setAttribute("aria-label",l)};
 const b=document.createElement("button");b.type="button";fill(b,"←","Назад","Назад");b.onclick=()=>{if(document.referrer.indexOf(location.origin)===0&&history.length>1)history.back();else location.href=base};n.append(b);
 if(inG||/igra\.html$/.test(P)){const m=document.createElement("button");m.type="button";m.className="gm";fill(m,"↩","В меню игры","В меню");m.title="Вернуться в начальное меню игры";m.onclick=()=>{if(window.IIGRY_TO_MENU)window.IIGRY_TO_MENU();else location.reload()};n.append(m)}
 [["🏠","Главная","Главная",""],["🎮","Игры","Игры","#catalog"],["🛠","Мастерская","Создать","masterskaya.html"],["👤","Кабинет","Кабинет","kabinet.html"]].forEach(([i,l,s,h])=>{const a=document.createElement("a");fill(a,i,l,s);a.href=base+h;if(h&&h===here)a.setAttribute("aria-current","page");n.append(a)});
 document.body.prepend(n);const pad=()=>{document.body.style.paddingTop="";const pt=parseFloat(getComputedStyle(document.body).paddingTop)||0;document.body.style.paddingTop=(pt+n.offsetHeight+6)+"px";document.documentElement.style.scrollPaddingTop=(n.offsetHeight+8)+"px"};pad();addEventListener("resize",pad)})();
</script></body></html>
