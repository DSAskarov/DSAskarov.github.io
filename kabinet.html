<script>/* Вход авторов «ИИгр»: Telegram-бот, почта или телефон — без паролей. Ключ входа хранится только в этом браузере и действует 30 дней. */
window.IIGRY_ACC=(function(){
  const API="https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av",K="iigry-sess";
  const tok=()=>{try{return localStorage.getItem(K)||""}catch(_){return ""}};
  const set=t=>{try{t?localStorage.setItem(K,t):localStorage.removeItem(K)}catch(_){}};
  const post=async(a,body)=>{const r=await fetch(API+"?a="+a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});let j={};try{j=await r.json()}catch(_){}return{r,j}};
  async function call(op,x){const t=tok();if(!t)return{need:"login"};
    try{const{r,j}=await post("u",Object.assign({op,token:t},x||{}));if(r.status===401){set("");return{need:"login"}}return r.ok?j:{error:j.error||"Ошибка сервера"}}catch(_){return{error:"Нет связи с сервером — попробуйте ещё раз"}}}
  // Запрос с проверкой «не робот» (нужна для писем и кодов)
  async function human(a,body){let pass=window.IIGRY_PASS?await IIGRY_PASS.need():"";let x=await post(a,Object.assign({pass},body));
    if(x.r.status===401&&window.IIGRY_PASS){IIGRY_PASS.clear&&IIGRY_PASS.clear();pass=await IIGRY_PASS.need();x=await post(a,Object.assign({pass},body))}return x}
  const mk=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
  const lab=(t,i)=>{const l=mk("label",null,"f");l.style.cssText="display:grid;gap:4px;font-weight:600;font-size:.92rem";l.append(t,i);return l};
  const inp=(ph,type,max)=>{const i=mk("input");i.placeholder=ph;i.type=type||"text";i.maxLength=max||100;return i};
  // Telegram: кнопка ведёт в бота, бот спрашивает «Это вы?», сайт сам замечает подтверждение
  function tgFlow(getSes,done,text){const box=mk("div");box.style.cssText="display:grid;gap:8px";
    const p=mk("p",text);p.style.margin="0";
    const a=mk("a","Открыть Telegram-бот","btn");a.target="_blank";a.rel="noopener";a.style.justifySelf="start";
    const st=mk("p","Готовим ссылку…","muted");st.setAttribute("aria-live","polite");st.style.margin="0";box.append(p,a,st);
    let ses=null,timer=null,t0=0;
    async function fresh(){clearInterval(timer);timer=null;a.removeAttribute("href");
      try{const j=await getSes();if(!/^https:\/\/t\.me\/iigry_bot\?start=in_[0-9a-f]{24}$/.test(j.link||""))throw new Error(j.error||"Нет связи с сервером.");
        ses=j;a.href=j.link;st.textContent="Нажмите кнопку — откроется Telegram. Ссылка действует 10 минут."}
      catch(e){st.textContent=(e.message||"Нет связи с сервером.")+" Обновите страницу через минуту."}}
    async function check(){if(!ses)return;if(Date.now()-t0>10*60e3){fresh();return}
      try{const{j}=await post("ucheck",{code:ses.code,poll:ses.poll});
        if(j.st==="ok"&&/^[A-Za-z0-9_-]{43}$/.test(j.token||"")){clearInterval(timer);timer=null;set(j.token);st.textContent="✅ Готово!";done&&done()}
        else if(j.st==="no"){st.textContent="Отменено в боте. Можно попробовать снова.";fresh()}
        else if(j.st==="gone"){st.textContent="Ссылка устарела — сделали новую.";fresh()}}catch(_){}}
    a.onclick=e=>{if(!ses){e.preventDefault();return}st.textContent="Ждём подтверждения: нажмите в боте «Да, это я»…";t0=Date.now();if(!timer)timer=setInterval(check,2500)};
    document.addEventListener("visibilitychange",()=>{if(timer&&!document.hidden)check()});
    fresh();return box}
  // Почта или телефон: сначала код, потом вход
  function codeFlow(kind,done){const box=mk("div");box.style.cssText="display:grid;gap:8px";
    const em=kind==="e",i=em?inp("you@mail.ru","email",254):inp("+7 900 123-45-67","tel",20);i.autocomplete=em?"email":"tel";
    const b=mk("button",em?"Прислать код на почту":"Прислать код","btn");b.type="button";b.style.justifySelf="start";
    const c=inp("6 цифр","text",6);c.inputMode="numeric";c.autocomplete="one-time-code";const cl=lab("Код из "+(em?"письма":"Telegram-бота"),c);cl.hidden=true;
    const go=mk("button","Войти","btn gold");go.type="button";go.hidden=true;go.style.justifySelf="start";
    const st=mk("p",em?"Если аккаунта ещё нет — он создастся сам.":"Код придёт в Telegram-бот. Номер привязывается в кабинете.","muted");st.style.margin="0";st.setAttribute("aria-live","polite");

      try{const{r,j}=await human(em?"elogin":"plogin",em?{email:i.value}:{phone:i.value});
        if(!r.ok)throw new Error(j.error||"Не получилось");st.textContent=j.note||"Код отправлен на почту. Проверьте и «Спам».";cl.hidden=false;go.hidden=false;c.focus()}
      catch(e){st.textContent=e.message||"Нет связи с сервером"}setTimeout(()=>{b.disabled=false},em?60000:20000)};
    go.onclick=async()=>{go.disabled=true;try{const{j}=await post(em?"echeck":"pcheck",em?{email:i.value,code:c.value.trim()}:{phone:i.value,code:c.value.trim()});
        if(j.st==="ok"&&/^[A-Za-z0-9_-]{43}$/.test(j.token||"")){set(j.token);st.textContent="✅ Готово!";done&&done()}else st.textContent=j.error||"Не получилось"}catch(_){st.textContent="Нет связи с сервером"}go.disabled=false};
    c.onkeydown=e=>{if(e.key==="Enter")go.click()};return box}
  function login(done){const box=mk("div",null,"acc-login");box.style.cssText="display:grid;gap:10px";
    const tabs=mk("div");tabs.setAttribute("role","tablist");tabs.style.cssText="display:flex;gap:6px;flex-wrap:wrap";const pane=mk("div");

    const show=n=>{[...tabs.children].forEach((x,k)=>{x.setAttribute("aria-selected",k===n);x.className="btn"+(k===n?"":" ghost")});pane.innerHTML="";pane.append(T[n][1]())};
    T.forEach((t,n)=>{const b=mk("button",t[0]);b.type="button";b.setAttribute("role","tab");b.onclick=()=>show(n);tabs.append(b)});

  return{tok,call,login,linkTg,human,out:async()=>{await call("out");set("")},drop:()=>set("")}})();
