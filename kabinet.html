<script>/* Вход авторов «ИИгр» через Telegram-бота, без паролей. Ключ входа хранится только в этом браузере и действует 30 дней. */
window.IIGRY_ACC=(function(){
  const API="https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av",K="iigry-sess";
  const tok=()=>{try{return localStorage.getItem(K)||""}catch(_){return ""}};
  const set=t=>{try{t?localStorage.setItem(K,t):localStorage.removeItem(K)}catch(_){}};
  async function call(op,x){const t=tok();if(!t)return{need:"login"};
    try{const r=await fetch(API+"?a=u",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({op,token:t},x||{}))}),j=await r.json();
      if(r.status===401){set("");return{need:"login"}}return r.ok?j:{error:j.error||"Ошибка сервера"}}catch(_){return{error:"Нет связи с сервером — попробуйте ещё раз"}}}
  const mk=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
  // Блок входа: кнопка ведёт в бота, бот спрашивает «Это вы?», сайт сам замечает подтверждение
  function login(done){const box=mk("div",null,"acc-login");box.style.cssText="display:grid;gap:8px";
    const p=mk("p","Вход и регистрация — одной кнопкой через Telegram-бота @iigry_bot. Пароль не нужен: бот спросит «Это вы?», вы нажмёте «Да» — и сайт сам вас впустит.");p.style.margin="0";
    const a=mk("a","Войти через Telegram","btn");a.target="_blank";a.rel="noopener";a.style.justifySelf="start";a.setAttribute("aria-disabled","true");
    const st=mk("p","Готовим ссылку для входа…","muted");st.setAttribute("aria-live","polite");st.style.margin="0";
    box.append(p,a,st);let ses=null,timer=null,t0=0;
    async function fresh(){clearInterval(timer);timer=null;a.removeAttribute("href");a.setAttribute("aria-disabled","true");
      try{const r=await fetch(API+"?a=ulogin",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}),j=await r.json();
        if(!r.ok||!/^https:\/\/t\.me\/iigry_bot\?start=in_[0-9a-f]{24}$/.test(j.link||""))throw new Error(j.error||"");
        ses=j;a.href=j.link;a.removeAttribute("aria-disabled");st.textContent="Нажмите кнопку — откроется Telegram. Ссылка действует 10 минут."}
      catch(e){st.textContent=(e.message||"Нет связи с сервером.")+" Обновите страницу через минуту."}}
    async function check(){if(!ses)return;if(Date.now()-t0>10*60e3){fresh();return}
      try{const r=await fetch(API+"?a=ucheck",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:ses.code,poll:ses.poll})}),j=await r.json();
        if(j.st==="ok"&&/^[A-Za-z0-9_-]{43}$/.test(j.token||"")){clearInterval(timer);set(j.token);st.textContent="✅ Вы вошли!";done&&done()}
        else if(j.st==="no"){st.textContent="Вход отменён в боте. Можно попробовать снова.";fresh()}
        else if(j.st==="gone"){st.textContent="Ссылка устарела — сделали новую.";fresh()}}catch(_){}}
    a.onclick=e=>{if(!ses){e.preventDefault();return}st.textContent="Ждём подтверждения в Telegram: нажмите в боте «Да, это я»…";t0=Date.now();if(!timer)timer=setInterval(check,2500)};
    document.addEventListener("visibilitychange",()=>{if(timer&&!document.hidden)check()});
    fresh();return box}
  return{tok,call,login,out:async()=>{await call("out");set("")},drop:()=>set("")}})();

<script>
const $=id=>document.getElementById(id),el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
const ru=n=>new Intl.NumberFormat("ru-RU").format(n);
async function show(){const b=$("box");
  if(!IIGRY_ACC.tok()){b.innerHTML="";b.append(el("h2","Вход для авторов"),IIGRY_ACC.login(show),el("p","Публиковать проекты на сайте могут только зарегистрированные авторы. Входя, вы соглашаетесь с условиями и обработкой данных: мы храним номер вашего чата с ботом и выбранный ник.","muted"));return}

</script><script>/* Счётчик посещений «ИИгр»: случайный номер устройства хранится только в этом браузере; без cookie и слежки на других сайтах. Команда сайта не считается. */
(function(){try{if(navigator.webdriver||localStorage.getItem("iigry-mod"))return;let d=localStorage.getItem("iigry-did");

 function bar(){if(document.getElementById("iigry-maint-bar"))return;const s=document.createElement("div");s.id="iigry-maint-bar";s.textContent="🛠 Идут технические работы — возможны недолгие сбои";s.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:2147482999;background:#E7BD52;color:#1A1306;font:700 .9rem Golos Text,system-ui,sans-serif;text-align:center;padding:6px";document.body.append(s)}
