</div>
<script>
(function(){

 osago:["Страховка есть, просто не распечатал","Вчера купил, в базу ещё не попала"],licence:["Права дома забыл","Продлеваю, справка где-то тут…"],drunk:["Я трезвый! Это квас!","Только кефир пил, клянусь"],none:["Здравствуйте! Что-то случилось?","Добрый день, командир. Я ничего не нарушал вроде.","Здравствуйте. Документы вот, пожалуйста."]};
// ---------- карьера (сохраняется)

// ---------- смена
let G=null,raf=0,last=0,paused=false;
const WEATHERS=[["clear","☀️ ясно"],["rain","🌧 дождь"],["fog","🌫 туман"],["snow","❄️ снег"]];
const TASKS=[["belt","Рейд «Ремень»: 3 водителя без ремня",3],["speed","План по скорости: 4 лихача",4],["osago","Проверка страховок: 2 без ОСАГО",2],["phone","Рейд «Не отвлекайся»: 3 с телефоном",3],["drunk","Рейд «Трезвый водитель»: 1 нетрезвый",1]];
function newShift(night){const wx=WEATHERS[R(night?3:4)];const t=TASKS[R(TASKS.length)];
  G={t:180,score:0,budget:0,compl:0,miss:0,cars:[],spawn:1,sel:null,task:t,taskN:0,taskDone:false,over:false,night,wx:wx[0],wxN:wx[1],chase:null,drops:[],honorD:0,lvl:C.rank,stats:{fines:0,free:0,bribes:0,chase:0}};
  $("ov").hidden=true;insp();hud();last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function newCar(){const lane=R(3),bad=ch(.42+G.lvl*.03),n=NAMES[R(NAMES.length)],c={lane,x:LANES[lane],y:H+60,col:COLORS[R(COLORS.length)],state:"drive",face:n[0],name:n[1],checked:{}};
  c.speed=bad&&ch(.5)?(G.wx==="clear"?72:62)+R(40):32+R(26);c.belt=!(bad&&ch(.35));c.phone=bad&&ch(.25);c.lights=!(bad&&ch(.25));c.tint=bad&&ch(.18);
  c.osago=!(bad&&ch(.25));c.licence=!(bad&&ch(.12));c.drunk=bad&&ch(G.night?.25:.1);c.bribe=ch(.15+G.lvl*.025);c.flee=c.drunk&&ch(.5)||(!c.licence&&ch(.3));
  c.vy=-(70+c.speed*1.6);const v=viol(c),k=v.length?v[R(v.length)]:"none";c.excuse=EXCUSE[k][R(EXCUSE[k].length)];c.lie=v.length>0;return c}
function viol(c){const v=[];if(c.speed>80)v.push("speed");if(!c.belt)v.push("belt");if(c.phone)v.push("phone");if(!c.lights&&(G.night||G.wx!=="clear"))v.push("lights");if(c.tint)v.push("tint");if(!c.osago)v.push("osago");if(!c.licence)v.push("licence");if(c.drunk)v.push("drunk");return v}
function hud(){const r=RANKS[C.rank];$("hRank").textContent="🎖 "+r;if(!G)return;$("hT").textContent="⏱ "+Math.floor(G.t/60)+":"+String(Math.floor(G.t%60)).padStart(2,"0");$("hS").textContent="⭐ "+G.score;
  $("hK").textContent="⚖️ честь "+Math.round(clamp(C.honor+G.honorD,0,100));$("hW").textContent=(G.night?"🌙 ночь · ":"☀️ день · ")+G.wxN;$("hM").textContent="🚗 упущено "+G.miss;
  $("task").textContent="📋 Задание начальника: "+G.task[1]+" — "+Math.min(G.taskN,G.task[2])+"/"+G.task[2]+(G.taskDone?" ✅":"")}
let fl=[];const flash=(t,c)=>{fl.push({t,c,a:2})};
function step(dt){if(G.chase)return chaseStep(dt);G.t-=dt;if(G.t<=0){G.t=0;return endShift()}
  G.spawn-=dt;const busy=G.cars.filter(c=>c.state!=="gone").length;if(G.spawn<=0&&busy<7){G.cars.push(newCar());G.spawn=Math.max(.7,1.9-G.lvl*.12)+Math.random()*.8}
  const slip=G.wx==="snow"||G.wx==="rain";
  for(const c of G.cars){if(c.state==="drive"){c.y+=c.vy*dt;if(c.y<-80){c.state="gone";if(viol(c).includes("speed")||c.drunk){G.miss++;G.score-=2;flash("Упустили нарушителя: −2","#FF8A8F")}}}
    else if(c.state==="pull"){const tx=490,ty=POST_Y+50;c.x+=(tx-c.x)*Math.min(1,dt*3);c.y+=(ty-c.y)*Math.min(1,dt*3);if(Math.abs(c.y-ty)<2)c.state="stop"}
    else if(c.state==="leave"){c.x+=(LANES[2]-c.x)*Math.min(1,dt*2);c.y-=200*dt;if(c.y<-80)c.state="gone"}}
  for(const a of G.cars)if(a.state==="drive")for(const b of G.cars)if(b!==a&&b.state==="drive"&&b.lane===a.lane&&b.y<a.y&&a.y-b.y<92)a.y=b.y+92;
  // ДТП в гололёд
  if(slip&&ch(dt*.012)){const c=G.cars.find(c=>c.state==="drive"&&c.y<H*.7&&c.y>H*.3);if(c){c.state="crash";flash("💥 Машину занесло! Помогите водителю","#F2C45A")}}
  G.cars=G.cars.filter(c=>c.state!=="gone");
  if(G.wx!=="clear")for(let i=0;i<(G.wx==="fog"?0:3);i++)G.drops.push({x:Math.random()*W,y:-10,v:G.wx==="snow"?80+Math.random()*60:500+Math.random()*200});
  G.drops.forEach(d=>d.y+=d.v*dt);G.drops=G.drops.filter(d=>d.y<H);hud()}
// ---------- рисование
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function car(c,x,y,rot){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.fillStyle="rgba(0,0,0,.35)";rr(-22,-36,50,80,10);ctx.fill();ctx.fillStyle=c.col;rr(-25,-40,50,80,11);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.18)";rr(-21,-36,10,72,5);ctx.fill();ctx.fillStyle=c.tint?"#0b0b0f":"#9fd3ff";rr(-19,-24,38,17,5);ctx.fill();ctx.fillStyle=c.tint?"#0b0b0f":"#7fb6e0";rr(-19,14,38,13,5);ctx.fill();
  ctx.fillStyle="#111";[[-27,-26],[22,-26],[-27,16],[22,16]].forEach(([a,b])=>ctx.fillRect(a,b,5,12));
  ctx.fillStyle=c.lights?"#FFF6B0":"#444";ctx.fillRect(-21,-43,11,5);ctx.fillRect(10,-43,11,5);ctx.fillStyle="#C2262E";ctx.fillRect(-21,38,11,4);ctx.fillRect(10,38,11,4);
  if(c.police){ctx.fillStyle=Math.floor(performance.now()/180)%2?"#E8333F":"#4A8CF0";ctx.fillRect(-12,-4,24,7)}

let off=0;

  ctx.fillStyle=n?"#24272d":"#3b3f46";ctx.fillRect(125,0,310,H);off=(off+dt*240)%60;ctx.strokeStyle="#EDEDED";ctx.lineWidth=4;ctx.setLineDash([30,30]);ctx.lineDashOffset=-off;[228,332].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()});ctx.setLineDash([]);
  ctx.fillStyle="#fff";ctx.fillRect(125,0,4,H);ctx.fillRect(431,0,4,H);
  for(let i=0;i<6;i++){const y=(i*130+off*2)%(H+80)-40;ctx.font="34px system-ui";ctx.textAlign="center";ctx.fillText(i%2?"🌳":"🌲",55,y)}
  ctx.fillStyle="#cfd3da";rr(462,POST_Y-80,84,60,8);ctx.fill();ctx.fillStyle="#3a5a8c";ctx.fillRect(462,POST_Y-80,84,14);ctx.fillStyle="#fff";ctx.font="800 11px Rubik,system-ui";ctx.fillText("ДПС",504,POST_Y-69);ctx.font="34px system-ui";ctx.fillText("👮",504,POST_Y-34);
  ctx.fillStyle="rgba(255,255,255,.14)";ctx.fillRect(125,POST_Y+280,310,5);ctx.font="700 12px Golos Text,system-ui";ctx.fillStyle="#fff";ctx.textAlign="left";ctx.fillText("📡 радар",440,POST_Y+296);
  ctx.textAlign="center";ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(60,POST_Y-60,26,0,7);ctx.fill();ctx.strokeStyle="#E8333F";ctx.lineWidth=6;ctx.stroke();ctx.fillStyle="#111";ctx.font="800 22px Rubik,system-ui";ctx.fillText("60",60,POST_Y-52);
  if(n){ctx.fillStyle="rgba(255,240,180,.08)";ctx.beginPath();ctx.arc(504,POST_Y,170,0,7);ctx.fill()}}
function drawShift(dt){scene(dt);if(!G)return;
  for(const c of G.cars){const crash=c.state==="crash";car(c,c.x,c.y,crash?.6:0);if(crash){ctx.font="28px system-ui";ctx.fillText("💥",c.x+28,c.y-30)}
    if(c.state==="drive"&&c.y<H-10){const seen=C.gear.radar?c.y<H-20:c.y<POST_Y+290;ctx.font="700 14px Rubik,system-ui";ctx.textAlign="center";ctx.fillStyle="rgba(0,0,0,.72)";rr(c.x-31,c.y-72,62,22,8);ctx.fill();
      ctx.fillStyle=!seen?"#9aa":c.speed>80?"#FF6B70":c.speed>60?"#F2C45A":"#C8F7DA";ctx.fillText(seen?c.speed+" км/ч":"…",c.x,c.y-56);const ic=(c.lights?"":"🔦")+(c.tint?"🕶":"");if(ic){ctx.font="17px system-ui";ctx.fillText(ic,c.x,c.y-82)}}}

    for(const c of G.cars)if(c.lights&&c.state!=="gone"){ctx.fillStyle="rgba(255,245,190,.18)";ctx.beginPath();ctx.moveTo(c.x-18,c.y-42);ctx.lineTo(c.x-45,c.y-170);ctx.lineTo(c.x+45,c.y-170);ctx.lineTo(c.x+18,c.y-42);ctx.fill()}}
  if(G.wx==="fog"){const g=ctx.createLinearGradient(0,H,0,0);g.addColorStop(0,"rgba(200,205,210,.75)");g.addColorStop(.5,"rgba(200,205,210,.1)");g.addColorStop(1,"rgba(200,205,210,.25)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  ctx.strokeStyle=G.wx==="snow"?"rgba(255,255,255,.9)":"rgba(170,200,255,.55)";ctx.lineWidth=G.wx==="snow"?3:1.5;for(const d of G.drops){ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+(G.wx==="snow"?.5:-2),d.y+(G.wx==="snow"?2:12));ctx.stroke()}
  fl=fl.filter(f=>f.a>0);fl.slice(-2).forEach((f,i)=>{ctx.globalAlpha=Math.min(1,f.a);ctx.fillStyle="rgba(0,0,0,.65)";rr(W/2-200,H-80-i*46,400,38,12);ctx.fill();ctx.fillStyle=f.c;ctx.font="700 15px Golos Text,system-ui";ctx.textAlign="center";ctx.fillText(f.t,W/2,H-55-i*46);ctx.globalAlpha=1;f.a-=dt})}
