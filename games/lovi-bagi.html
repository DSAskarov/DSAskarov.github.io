<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://functions.yandexcloud.net; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Игра площадки «ИИгры онлайн»"><meta property="og:title" content="Лови баги — ИИгры онлайн"><meta property="og:description" content="Игра площадки «ИИгры онлайн»"><meta name="theme-color" content="#0B0A0E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B3141F'/%3E%3Ctext x='32' y='44' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23F6DE8D'%3EИИ%3C/text%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Лови баги</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Golos+Text:wght@400;600&display=swap">
<style>
/* Layout: одна игровая панель по центру — счёт сверху, поле, кнопка. Тёмная «ночная смена» с красными багами и зелёными фичами. */
:root{--bg:#0B0A0E;--panel:#16141B;--fg:#F4F4F6;--muted:#B9B6C2;--red:#E8333F;--gold:#E7BD52;--green:#4ADE95;--line:rgba(255,255,255,.12);color-scheme:dark;
  --f-d:"Rubik","Golos Text",system-ui,sans-serif;--f-b:"Golos Text",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(70vmax 60vmax at 15% 0%,rgba(232,51,63,.25),transparent 60%),var(--bg);color:var(--fg);font-family:var(--f-b);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.game{width:min(640px,100%);display:grid;gap:12px}
h1{font:800 clamp(1.4rem,5vw,2rem)/1.1 var(--f-d);margin:0}
h1 b{color:var(--red)}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.hud{display:flex;gap:10px;flex-wrap:wrap}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums}
.hud b{font:800 1.1rem var(--f-d)}
canvas{width:100%;aspect-ratio:16/10;max-width:100%;background:linear-gradient(180deg,#121017,#0B0A0E);border:1px solid var(--line);border-radius:14px;touch-action:manipulation;cursor:crosshair;display:block}
.btn{border:0;border-radius:10px;padding:12px 20px;font:700 1rem var(--f-b);background:linear-gradient(135deg,#FF4A55,#A3101C);color:#fff;cursor:pointer;justify-self:start}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.credit{font-size:.8rem;color:var(--muted)}
.credit a{color:var(--gold)}
</style>
<div class="game">
  <h1>Лови <b>баги</b></h1>
  <p class="sub">Ночная смена в отделе разработки. Ловите красные баги, не трогайте зелёные фичи — они и так еле держатся.</p>
  <div class="hud"><div>Счёт: <b id="sc">0</b></div><div>Время: <b id="tm">30</b></div><div>Рекорд: <b id="best">0</b></div></div>
  <canvas id="cv" width="640" height="400" aria-label="Игровое поле"></canvas>
  <div class="legend"><span><i style="background:#E8333F"></i>Баг: +1</span><span><i style="background:#E7BD52"></i>Золотой баг: +5</span><span><i style="background:#4ADE95"></i>Фича: −3, не трогать</span></div>
  <button class="btn" id="go">Начать смену</button>
  <p class="credit">Игра DSAskarov для площадки «ИИгры онлайн». Поддержать автора: <a href="https://boosty.to/dsaskarov" target="_blank" rel="noopener">Boosty</a> · связь: Telegram @dsaskarov</p>
</div>
<script>
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),W=cv.width,H=cv.height;
let bugs=[],score=0,time=30,run=false,last=0,spawn=0,best=0,msg="Нажмите «Начать смену»";
try{best=+localStorage.getItem("bugs-best")||0}catch(e){}
document.getElementById("best").textContent=best;
const LINES=["Это не баг, это фича!","Работает на моём компьютере","Кто трогал прод?","Пятница, 18:59","Сейчас быстренько поправлю"];
function add(){const r=Math.random(),type=r<.08?"gold":r<.3?"feat":"bug",sz=type==="gold"?14:18+Math.random()*8;
  bugs.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),vx:(Math.random()-.5)*(1.4+score/25),vy:(Math.random()-.5)*(1.4+score/25),r:sz,type,life:type==="gold"?1.6:3.2})}
function drawBug(b){const c=b.type==="gold"?"#E7BD52":b.type==="feat"?"#4ADE95":"#E8333F";
  cx.save();cx.translate(b.x,b.y);cx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
  cx.strokeStyle=c;cx.lineWidth=2;for(let i=-1;i<=1;i++){cx.beginPath();cx.moveTo(-b.r*.6,i*b.r*.35);cx.lineTo(-b.r*1.1,i*b.r*.5);cx.moveTo(b.r*.6,i*b.r*.35);cx.lineTo(b.r*1.1,i*b.r*.5);cx.stroke()}
  cx.fillStyle=c;cx.beginPath();cx.ellipse(0,0,b.r*.7,b.r,0,0,7);cx.fill();
  cx.fillStyle="rgba(0,0,0,.35)";cx.beginPath();cx.arc(0,-b.r*.75,b.r*.4,0,7);cx.fill();
  if(b.type==="feat"){cx.fillStyle="#04170C";cx.font="bold "+(b.r*.8)+"px sans-serif";cx.textAlign="center";cx.fillText("✓",0,b.r*.35)}
  cx.restore()}
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
  cx.clearRect(0,0,W,H);
  if(run){time-=dt;spawn-=dt;if(spawn<=0){add();spawn=Math.max(.25,.9-score/80)}
    bugs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life-=dt;if(b.x<b.r||b.x>W-b.r)b.vx*=-1;if(b.y<b.r||b.y>H-b.r)b.vy*=-1});
    bugs=bugs.filter(b=>b.life>0);
    if(time<=0){run=false;time=0;bugs=[];if(score>best){best=score;try{localStorage.setItem("bugs-best",best)}catch(e){}}
      msg=score>=40?"Легенда ночной смены!":score>=20?"Прод спасён. Можно спать.":"Баги победили. Пока что.";document.getElementById("go").textContent="Ещё смену"}
    document.getElementById("tm").textContent=Math.ceil(time)}
  bugs.forEach(drawBug);
  if(!run){cx.fillStyle="rgba(244,244,246,.92)";cx.font="700 22px Golos Text, sans-serif";cx.textAlign="center";cx.fillText(msg,W/2,H/2-6);
    if(score){cx.fillStyle="#B9B6C2";cx.font="16px Golos Text, sans-serif";cx.fillText("Поймано: "+score+" · рекорд: "+best,W/2,H/2+22)}}
  document.getElementById("sc").textContent=score;document.getElementById("best").textContent=best;
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function hit(e){if(!run)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(let i=bugs.length-1;i>=0;i--){const b=bugs[i];if(Math.hypot(b.x-x,b.y-y)<b.r*1.3){score+=b.type==="gold"?5:b.type==="feat"?-3:1;if(score<0)score=0;
    if(b.type==="feat")msg=LINES[Math.floor(Math.random()*LINES.length)];bugs.splice(i,1);return}}}
cv.addEventListener("pointerdown",hit);
document.getElementById("go").onclick=()=>{score=0;time=30;bugs=[];spawn=0;run=true;msg=""};
</script>

</body></html>
