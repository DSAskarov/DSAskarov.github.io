<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Жизнь с нуля — ИИгры онлайн</title>
<style>
:root{--bg:#0D0C11;--card:#17151D;--line:rgba(255,255,255,.1);--fg:#F4F4F6;--mu:#B9B6C2;--gold:#E7BD52;--red:#E8333F;--grn:#4ADE95;--f-b:"Golos Text",system-ui,sans-serif;--f-d:"Rubik",system-ui,sans-serif}
html,body{min-height:100%}html{background:#0D0C11}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-b);padding:12px}
.w{max-width:760px;margin:0 auto;display:grid;gap:12px}
h1{margin:0;font:900 clamp(1.5rem,5vw,2.2rem) var(--f-d)}h1 b{color:var(--gold)}
.mu{color:var(--mu);margin:0;font-size:.93rem}
.top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.ava{font-size:54px;width:72px;height:72px;display:grid;place-items:center;background:#0F0E13;border-radius:50%}
.rank{font:800 1.1rem var(--f-d)}.money{font:800 1.4rem var(--f-d);color:var(--gold)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:6px;font-size:.88rem}
.bar i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.bar i b{display:block;height:100%;transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:700 14px var(--f-b);cursor:pointer}.tab[aria-selected=true]{border-color:var(--gold);color:var(--gold)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.act{display:grid;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--fg);cursor:pointer;font:inherit;min-height:84px}
.act:hover:not(:disabled){border-color:var(--gold)}.act:disabled{opacity:.42;cursor:default}.act b{font-size:1rem}.act small{color:var(--mu);font-size:.8rem}.act .fx{font-size:.78rem;color:#C9C6D2}
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-height:180px;overflow:auto;font-size:.9rem;display:grid;gap:4px}
.log p{margin:0}.log .g{color:var(--grn)}.log .r{color:#FF8A8F}.log .y{color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,4,9,.75);display:grid;place-items:center;padding:16px;z-index:50}.modal[hidden]{display:none}
.modal .c{max-width:420px;background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:18px;display:grid;gap:10px;text-align:center}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#221F2A;color:#fff;font:700 15px var(--f-b);cursor:pointer}.btn.go{background:linear-gradient(135deg,#F2C45A,#C98E2B);color:#1A1306;border:0}
.goal{background:rgba(231,189,82,.08);border:1px solid rgba(231,189,82,.35);border-radius:12px;padding:8px 12px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style></head><body>
<div class="w">
  <h1>Жизнь <b>с нуля</b></h1>
  <p class="mu">Вы проснулись на лавке в парке: ни денег, ни документов, ни планов. Соберите жизнь заново — от бутылок до собственного дела.</p>
  <div class="top"><div class="ava" id="ava">🧔</div><div><div class="rank" id="rank"></div><div class="money" id="money"></div><div class="mu" id="day"></div></div></div>
  <div class="bars" id="bars"></div>
  <div class="goal" id="goal"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="acts" id="acts"></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="row"><button class="btn" id="restart" type="button">↻ Начать заново</button></div>
</div>
<div class="modal" id="modal" hidden><div class="c"><b id="mT" style="font:800 1.3rem Rubik,system-ui,sans-serif"></b><p class="mu" id="mP"></p><div class="row" id="mB"></div></div></div>
<script>
(function(){
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n),chance=p=>Math.random()<p,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RANKS=[["🧔","Бездомный",0],["🧥","Обитатель ночлежки",1],["👷","Работяга",2],["🏠","Съёмщик комнаты",3],["👔","Офисный работник",4],["🏢","Владелец квартиры",5],["💼","Предприниматель",6]];
const KEY="iigry-snulya";let S;
function fresh(){return{day:1,hour:8,money:0,hp:70,food:50,mood:50,clean:30,rank:0,items:{},rep:0,job:null,home:null,biz:0,dead:false,won:false,log:[],best:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.day)return s}catch(_){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}
const has=k=>!!S.items[k];
function say(t,c){S.log.unshift([t,c||""]);S.log=S.log.slice(0,40)}
// время идёт: каждое действие тратит часы, ночь — сон
function pass(h){for(let i=0;i<h;i++){S.hour++;S.food-=has("room")||S.home?2.2:2.8;S.clean-=1;if(S.hour>=24){S.hour=0;newDay()}}
  if(S.food<=0){S.hp+=S.food*.8;S.food=0}if(S.clean<=0)S.clean=0;if(S.clean<15)S.mood-=1;if(S.hp<30)S.mood-=1}
function newDay(){S.day++;if(S.home==="room")S.money-=150,say("🏠 Аренда комнаты: −150 ₽","r");if(S.home==="flat"){}
  if(S.biz)S.money+=S.biz,say("💼 Доход дела: +"+S.biz+" ₽","g");
  if(S.money<0&&S.home==="room"){S.home=null;S.items.room=false;S.money=0;say("😿 Не хватило на аренду — снова на улице.","r")}
  if(!S.home&&S.day%3===0&&chance(.3)){S.hp-=8;say("🌧 Ночь выдалась холодной: −8 здоровья.","r")}}
// действия: [вкладка, ключ, название, описание, часы, условие, эффект]
const A=[
 ["work","bottles","Собирать бутылки","Пакет тары в пункт приёма",3,()=>true,()=>{const m=(has("cart")?90:40)+R(30);S.money+=m;S.food-=4;S.clean-=3;say("♻️ Сдали тару: +"+m+" ₽","g")}],
 ["work","beg","Просить у метро","Как повезёт — и как одеты",2,()=>!S.job,()=>{const m=R(has("guitar")?160:70)+(S.clean>50?20:0);S.money+=m;S.mood-=m<20?6:1;say(m?"🥺 Прохожие подали "+m+" ₽":"🥺 Сегодня никто не подал…",m?"g":"r");if(chance(.08)){S.money=Math.max(0,S.money-60);say("👮 Попросили «пройти» — штраф 60 ₽","r")}}],
 ["work","guitarplay","Играть на гитаре","Нужна гитара. Поднимает настроение",3,()=>has("guitar"),()=>{const m=60+R(180);S.money+=m;S.mood+=10;say("🎸 Отыграли сет: +"+m+" ₽","g")}],
 ["work","loader","Подработка грузчиком","Нужно здоровье от 40",5,()=>S.hp>=40,()=>{const m=450+R(150);S.money+=m;S.hp-=10;S.food-=10;S.clean-=10;say("📦 Разгрузили фуру: +"+m+" ₽","g")}],
 ["work","courier","Курьер на смену","Нужны телефон и чистая одежда",6,()=>has("phone")&&has("clothes")&&S.clean>=30,()=>{const m=1100+R(400);S.money+=m;S.hp-=6;S.food-=10;say("🛵 Смена курьером: +"+m+" ₽","g");S.rep+=1}],
 ["work","office","Рабочий день в офисе","Нужны документы, костюм и телефон",8,()=>S.job==="office",()=>{const m=2600+R(400);S.money+=m;S.mood-=4;S.food-=8;say("💻 Зарплата за день: +"+m+" ₽","g");S.rep+=2}],
 ["work","getjob","Устроиться в офис","Документы + костюм + репутация 15",2,()=>S.job!=="office"&&has("docs")&&has("suit")&&S.rep>=15,()=>{S.job="office";say("🎉 Вас взяли в офис! Теперь доступны рабочие дни.","y")}],
 ["food","trash","Порыться в мусорке","Бесплатно, но рискованно",1,()=>true,()=>{S.food+=18;S.clean-=6;if(chance(.25)){S.hp-=12;say("🤢 Что-то было несвежим: −12 здоровья","r")}else say("🍞 Нашли полбатона: +сытость","g")}],
 ["food","shawarma","Шаурма","120 ₽",1,()=>S.money>=120,()=>{S.money-=120;S.food+=40;S.mood+=4;say("🌯 Шаурма: +сытость")}],
 ["food","canteen","Обед в столовой","250 ₽ — сытно и полезно",1,()=>S.money>=250,()=>{S.money-=250;S.food+=60;S.hp+=6;say("🍲 Обед в столовой: +сытость, +здоровье")}],
 ["food","free","Бесплатная еда у фонда","Раз в день, нужно постоять в очереди",3,()=>S.freeDay!==S.day,()=>{S.freeDay=S.day;S.food+=45;S.mood+=3;say("🥣 Волонтёры накормили. Спасибо им!","g")}],
 ["life","sleepbench","Спать на лавке","Бесплатно, холодно",8,()=>!S.home,()=>{S.hp+=chance(.3)?-6:6;S.mood-=4;say("🌙 Ночь на лавке.")}],
 ["life","shelter","Ночлежка","200 ₽ — тепло и душ",8,()=>S.money>=200&&!S.home,()=>{S.money-=200;S.hp+=15;S.clean=Math.max(S.clean,70);S.mood+=5;if(S.rank<1)S.rank=1;say("🛏 Ночь в ночлежке: тепло и душ","g")}],
 ["life","sleephome","Спать дома","Своя кровать",8,()=>!!S.home,()=>{S.hp+=22;S.mood+=8;S.clean=Math.max(S.clean,90);say("😴 Выспались дома","g")}],
 ["life","bath","Помыться в бане","300 ₽",2,()=>S.money>=300,()=>{S.money-=300;S.clean=100;S.mood+=8;say("🧼 Баня: чистота 100%","g")}],
 ["life","doctor","Сходить к врачу","500 ₽, +30 здоровья",2,()=>S.money>=500,()=>{S.money-=500;S.hp+=30;say("🩺 Врач подлечил: +30 здоровья","g")}],
 ["life","park","Погулять по парку","Бесплатно, +настроение",2,()=>true,()=>{S.mood+=10;if(chance(.12)){const m=200+R(800);S.money+=m;say("👛 Нашли кошелёк с "+m+" ₽! (А документы отнесли в полицию.)","y");S.rep+=1}else say("🌳 Погуляли — стало легче")}],
 ["shop","cart","Тележка","300 ₽ — бутылок в два раза больше",0,()=>!has("cart")&&S.money>=300,()=>{S.money-=300;S.items.cart=1;say("🛒 Купили тележку","y")}],
 ["shop","guitar","Б/у гитара","900 ₽ — играть на улице",0,()=>!has("guitar")&&S.money>=900,()=>{S.money-=900;S.items.guitar=1;say("🎸 Купили гитару","y")}],
 ["shop","clothes","Чистая одежда","1 500 ₽ — для работы",0,()=>!has("clothes")&&S.money>=1500,()=>{S.money-=1500;S.items.clothes=1;S.clean=Math.max(S.clean,60);say("👕 Купили нормальную одежду","y")}],
 ["shop","phone","Простой телефон","2 500 ₽ — для подработок",0,()=>!has("phone")&&S.money>=2500,()=>{S.money-=2500;S.items.phone=1;say("📱 Купили телефон","y")}],
 ["shop","docs","Восстановить документы","4 000 ₽ и полдня",5,()=>!has("docs")&&S.money>=4000,()=>{S.money-=4000;S.items.docs=1;if(S.rank<2)S.rank=2;say("🪪 Документы восстановлены! Вы — Работяга.","y")}],
 ["shop","suit","Костюм","8 000 ₽ — для офиса",0,()=>!has("suit")&&S.money>=8000,()=>{S.money-=8000;S.items.suit=1;say("👔 Купили костюм","y")}],
 ["shop","room","Снять комнату","5 000 ₽ залог, потом 150 ₽ в день",1,()=>!S.home&&has("docs")&&S.money>=5000,()=>{S.money-=5000;S.home="room";S.items.room=1;if(S.rank<3)S.rank=3;say("🏠 Сняли комнату! Теперь есть дом.","y")}],
 ["shop","flat","Купить квартиру","300 000 ₽ — своё жильё навсегда",2,()=>S.home!=="flat"&&S.money>=300000,()=>{S.money-=300000;S.home="flat";if(S.rank<5)S.rank=5;if(S.biz)S.rank=6;say("🔑 Своя квартира! Аренда больше не нужна.","y")}],
 ["shop","biz","Открыть кофейню","150 000 ₽ — доход каждый день",3,()=>S.job==="office"&&S.money>=150000,()=>{S.money-=150000;S.biz+=3500;say("☕ Открыли кофейню: +3 500 ₽ в день","y");if(S.home==="flat"){S.rank=6}}]
];
const TABS=[["work","💰 Заработок"],["food","🍽 Еда"],["life","❤️ Жизнь"],["shop","🛍 Покупки"]];let tab="work";
// случайные события
const EV=[
 [()=>chance(.05),"🐕 Бездомный пёс увязался за вами. Взять его к себе?",[["Взять",()=>{S.items.dog=1;S.mood+=15;say("🐕 Теперь у вас есть друг!","y")}],["Пройти мимо",()=>{}]]],
 [()=>chance(.04)&&S.money>300,"🎰 Мутный тип предлагает «удвоить» деньги в напёрстки.",[["Сыграть (300 ₽)",()=>{S.money-=300;say("🎲 Конечно, проиграли. Напёрстки не обыграть.","r")}],["Отказаться",()=>{S.mood+=2;say("👍 Правильно — это лохотрон.","g")}]]],
 [()=>chance(.04),"🧓 Пожилая женщина просит помочь донести сумки.",[["Помочь",()=>{S.rep+=3;S.mood+=6;const m=R(2)?100:0;S.money+=m;pass(1);say("😊 Помогли"+(m?" — и она дала 100 ₽ на чай":"")+". Репутация растёт.","g")}],["Отказаться",()=>{S.mood-=3}]]],
 [()=>chance(.03)&&S.hp<50,"🤒 Вас знобит. Похоже, простуда.",[["Отлежаться",()=>{pass(6);S.hp+=5}],["Терпеть",()=>{S.hp-=10}]]],
 [()=>chance(.03)&&S.rank>=2,"📢 Знакомый зовёт в бригаду на выходные: 3 000 ₽ за два дня.",[["Согласиться",()=>{pass(16);S.money+=3000;S.hp-=15;say("🔨 Отработали выходные: +3 000 ₽","g")}],["Не сейчас",()=>{}]]]
];
function modal(t,p,btns){$("mT").textContent=t;$("mP").textContent=p;const b=$("mB");b.innerHTML="";btns.forEach(([n,f],i)=>{const x=document.createElement("button");x.className="btn"+(i?"":" go");x.textContent=n;x.onclick=()=>{$("modal").hidden=true;f&&f();check();render()};b.append(x)});$("modal").hidden=false;b.firstChild&&b.firstChild.focus()}
function check(){S.hp=clamp(S.hp,-50,100);S.food=clamp(S.food,0,100);S.mood=clamp(S.mood,0,100);S.clean=clamp(S.clean,0,100);S.money=Math.round(S.money);
  const worth=S.money+(S.home==="flat"?300000:0)+S.biz*30;if(worth>S.best)S.best=worth;
  if(S.mood<=0&&!S.dead){S.mood=20;S.hp-=15;say("😞 Совсем опустились руки… −15 здоровья. Погуляйте и поешьте.","r")}
  if(S.hp<=0&&!S.dead){S.dead=true;save();submit(false);modal("Здоровье закончилось","Прожито дней: "+S.day+". Лучший капитал: "+fmt(S.best)+" ₽. Попробуйте ещё раз — теперь вы знаете, с чего начать.",[["Начать заново",()=>{S=fresh();say("☀️ Новое утро, новый шанс.","y")}]]);return}
  if(S.rank===6&&!S.won){S.won=true;save();submit(true);modal("Вы — предприниматель! 🎉","От лавки в парке до своей квартиры и кофейни за "+S.day+" дн. Капитал: "+fmt(S.best)+" ₽.",[["Играть дальше",()=>{}],["Начать заново",()=>{S=fresh()}]])}}
function submit(full){if(window.IIGRY_SCORE&&S.best>0)window.IIGRY_SCORE(Math.round(S.best/100),full?{full:true}:undefined)}
const fmt=n=>Math.round(n).toLocaleString("ru-RU");
function render(){const r=RANKS[S.rank];$("ava").textContent=r[0];$("rank").textContent=r[1]+(S.items.dog?" 🐕":"");$("money").textContent=fmt(S.money)+" ₽";
  $("day").textContent="День "+S.day+", "+String(S.hour).padStart(2,"0")+":00 · "+(S.home==="flat"?"своя квартира":S.home==="room"?"съёмная комната":"без жилья")+(S.job?" · работа в офисе":"");
  const B=[["❤️ Здоровье",S.hp,"#4ADE95"],["🍞 Сытость",S.food,"#E7BD52"],["🙂 Настроение",S.mood,"#7AB8FF"],["🧼 Чистота",S.clean,"#B79CFF"]];
  $("bars").innerHTML=B.map(([n,v,c])=>`<div class="bar"><span>${n}: <b>${Math.max(0,Math.round(v))}</b></span><i><b style="width:${clamp(v,0,100)}%;background:${v<25?"#E8333F":c}"></b></i></div>`).join("");
  const next=["Накопите 200 ₽ и переночуйте в ночлежке","Восстановите документы (4 000 ₽)","Снимите комнату (5 000 ₽ залога)","Купите костюм и устройтесь в офис (репутация 15)","Накопите на квартиру (300 000 ₽)","Откройте кофейню (150 000 ₽)","Цель достигнута — живите в своё удовольствие!"][Math.min(6,S.rank===4?4:S.rank===3&&S.job==="office"?4:S.rank)];
  $("goal").textContent="🎯 Цель: "+next+" · репутация: "+S.rep;
  $("tabs").innerHTML=TABS.map(([k,n])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${k===tab}">${n}</button>`).join("");
  $("acts").innerHTML="";A.filter(a=>a[0]===tab).forEach(a=>{const ok=!S.dead&&a[5]();if(a[0]==="shop"&&!ok&&(S.items[a[1]]||(a[1]==="room"&&S.home)||(a[1]==="flat"&&S.home==="flat")))return;

  form.addEventListener("submit",e=>{e.preventDefault();const n=S(inp.value,30).trim().replace(/^@/,"");if(!n){say("Впишите ник.");return}setNick(n);if(pending){send(pending,n);pending=null}});
  top();setInterval(()=>{if(!document.hidden)top()},30000);
})();
</script>
</body></html>
