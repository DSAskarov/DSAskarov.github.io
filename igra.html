<script>/* Движок «Мастерской ИИгр»: запускает игру по настройкам. Всё рисуется на холсте, текст игрока никогда не вставляется как HTML. */
window.IIGRY_ENGINE=(function(){
const T={
 catch:{n:"Ловилка",e:"🧺",d:"Ловите хорошее, уворачивайтесь от плохого. Управление — мышью, пальцем или стрелками."},
 dodge:{n:"Уворачивайся",e:"🚀",d:"Сверху летят препятствия — продержитесь как можно дольше."},
 runner:{n:"Бегалка",e:"🏃",d:"Герой бежит сам, прыжок — нажатие или пробел. Перепрыгивайте препятствия, собирайте бонусы."},
 clicker:{n:"Кликер",e:"🍪",d:"Нажимайте на цель, копите очки, покупайте улучшения."},
 quiz:{n:"Викторина",e:"❓",d:"Вопросы с вариантами ответов — для знаний, шуток и поздравлений."}};
const D={v:1,t:"catch",title:"Моя игра",hero:"🧺",bg1:"#1B1530",bg2:"#0B0A0E",accent:"#E7BD52",speed:3,lives:3,time:45,goal:30,
 startText:"Нажмите, чтобы начать",winText:"Победа! Вы молодец!",loseText:"Игра окончена. Ещё разок?",
 good:["🍎","🍐","🍓"],bad:["💣"],obst:["🌵","🪨"],target:"🍪",
 ups:[{n:"Двойной клик",e:"👆",p:25,k:"tap",v:1},{n:"Помощник",e:"🤖",p:60,k:"auto",v:1},{n:"Фабрика",e:"🏭",p:250,k:"auto",v:5}],
 qs:[{q:"Сколько будет 2 + 2?",a:["3","4","5"],c:1},{q:"Какая планета самая большая?",a:["Марс","Земля","Юпитер","Венера"],c:2},{q:"Кто написал «Евгения Онегина»?",a:["Пушкин","Толстой","Гоголь"],c:0}]};
const PRESET={catch:{hero:"🧺",good:["🍎","🍐","🍓"],bad:["💣"],goal:30,time:45,lives:3},dodge:{hero:"🚀",bad:["☄️","🪨","👾"],goal:40,time:0,lives:3,bg1:"#0E1433"},
 runner:{hero:"🏃",obst:["🌵","🪨"],good:["⭐"],goal:500,time:0,lives:3,bg1:"#16301F"},clicker:{hero:"🍪",target:"🍪",goal:1000,time:0,lives:1,bg1:"#2A1A10"},quiz:{hero:"❓",goal:70,time:0,lives:1,bg1:"#1A1D3A"}};
const str=(v,n,d)=>{v=String(v==null?d:v).replace(/[\u0000-\u001F\u007F]/g," ").trim();return(v||String(d)).slice(0,n)};
const emo=(v,d)=>{v=String(v==null?"":v).trim();return v&&v.length<=12?v:d};
const col=(v,d)=>/^#[0-9a-f]{6}$/i.test(String(v||""))?v:d;
const int=(v,a,b,d)=>{v=Math.round(Number(v));return isFinite(v)?Math.min(b,Math.max(a,v)):d};
const list=(a,d,max)=>{a=(Array.isArray(a)?a:[]).map(x=>emo(x,"")).filter(Boolean).slice(0,max||6);return a.length?a:d};
function clean(c){c=c&&typeof c==="object"?c:{};const t=T[c.t]?c.t:"catch",o={v:1,t};
 o.title=str(c.title,40,D.title);o.hero=emo(c.hero,PRESET[t].hero);o.bg1=col(c.bg1,PRESET[t].bg1||D.bg1);o.bg2=col(c.bg2,D.bg2);o.accent=col(c.accent,D.accent);
 o.speed=int(c.speed,1,5,3);o.lives=int(c.lives,1,9,PRESET[t].lives);o.time=int(c.time,0,600,PRESET[t].time);o.goal=int(c.goal,0,1e6,PRESET[t].goal);
 o.startText=str(c.startText,80,D.startText);o.winText=str(c.winText,80,D.winText);o.loseText=str(c.loseText,80,D.loseText);
 o.good=list(c.good,PRESET[t].good||D.good);o.bad=list(c.bad,PRESET[t].bad||D.bad);o.obst=list(c.obst,D.obst);o.target=emo(c.target,D.target);
 o.ups=(Array.isArray(c.ups)?c.ups:D.ups).slice(0,4).map(u=>({n:str(u&&u.n,24,"Улучшение"),e:emo(u&&u.e,"⭐"),p:int(u&&u.p,1,1e6,10),k:u&&u.k==="auto"?"auto":"tap",v:int(u&&u.v,1,1000,1)}));
 o.qs=(Array.isArray(c.qs)?c.qs:D.qs).slice(0,30).map(q=>{const a=(Array.isArray(q&&q.a)?q.a:[]).map(x=>str(x,40,"")).filter(Boolean).slice(0,4);return{q:str(q&&q.q,140,"Вопрос"),a:a.length>=2?a:["Да","Нет"],c:int(q&&q.c,0,3,0)}}).map(q=>(q.c=Math.min(q.c,q.a.length-1),q));
 if(!o.qs.length)o.qs=D.qs;return o}
function preset(t){return clean(Object.assign({},D,PRESET[t]||{},{t,title:T[t]?T[t].n+" — моя версия":D.title}))}
function run(cfg,host,opt){cfg=clean(cfg);opt=opt||{};host.innerHTML="";
 const W=360,H=640,cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.style.cssText="width:100%;max-width:420px;aspect-ratio:9/16;display:block;margin:0 auto;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;outline:none";
 cv.tabIndex=0;cv.setAttribute("role","application");cv.setAttribute("aria-label","Игра «"+cfg.title+"». "+T[cfg.t].d);host.append(cv);
 const g=cv.getContext("2d"),dpr=Math.min(3,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;g.scale(dpr,dpr);
 const F=s=>s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',TF=(s,w)=>(w||600)+" "+s+'px "Golos Text",system-ui,sans-serif';
 const rnd=a=>a[Math.floor(Math.random()*a.length)],sp=0.6+cfg.speed*0.2,key="iigry-best-"+cfg.title;
 let best=0;try{best=+localStorage.getItem(key)||0}catch(_){}
 let st="menu",S={},px=W/2,keys={},raf=0,last=0,alive=true,fx=[];
 function reset(){S={score:0,lives:cfg.lives,t:0,items:[],spawn:0,y:0,vy:0,ground:H-110,dist:0,power:1,auto:0,owned:cfg.ups.map(()=>0),qi:0,ok:0,pick:-1,wait:0,hx:W/2,inv:0,order:cfg.qs.map((_,i)=>i)};fx=[]}
 function end(win){st=win?"win":"lose";const sc=Math.floor(S.score);if(sc>best){best=sc;try{localStorage.setItem(key,best)}catch(_){}}opt.onEnd&&opt.onEnd({score:sc,win})}
 function start(){reset();st="play"}
 const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
 function tap(p){if(st!=="play"){start();return}
  if(cfg.t==="runner"){if(S.y>=0){S.vy=-640;S.y=-0.01}}
  else if(cfg.t==="clicker"){if(Math.hypot(p.x-W/2,p.y-250)<90){S.score+=S.power;fx.push({x:p.x,y:p.y,t:0,s:"+"+S.power})}
   cfg.ups.forEach((u,i)=>{const y=420+i*52;if(p.y>y&&p.y<y+46&&p.x>20&&p.x<W-20){const price=Math.ceil(u.p*Math.pow(1.6,S.owned[i]));if(S.score>=price){S.score-=price;S.owned[i]++;if(u.k==="auto")S.auto+=u.v;else S.power+=u.v}}})}
  else if(cfg.t==="quiz"&&S.wait<=0){const q=cfg.qs[S.order[S.qi]];q.a.forEach((a,i)=>{const y=330+i*66;if(p.y>y&&p.y<y+56&&p.x>24&&p.x<W-24){S.pick=i;S.wait=1.1;if(i===q.c){S.ok++;S.score=S.ok}}})}}
 cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.focus();const p=pt(e);px=p.x;tap(p)});
 cv.addEventListener("pointermove",e=>{px=pt(e).x});
 const kd=e=>{if(!alive||document.activeElement!==cv&&!opt.globalKeys)return;keys[e.key]=1;if([" ","Enter","ArrowUp","w"].includes(e.key)){e.preventDefault();if(st!=="play"||cfg.t==="runner")tap({x:-1,y:-1})}},ku=e=>{keys[e.key]=0};
 addEventListener("keydown",kd);addEventListener("keyup",ku);
 function spawnFall(dt,rate,pool,badShare){S.spawn-=dt;if(S.spawn<=0){S.spawn=rate/sp*(0.6+Math.random()*0.8);const bad=Math.random()<badShare;S.items.push({x:30+Math.random()*(W-60),y:-30,v:(160+Math.random()*120)*sp*(1+S.t/90),e:bad?rnd(cfg.bad):rnd(pool),bad})}}
 function moveHero(dt){if(keys.ArrowLeft||keys.a)px=S.hx-300*dt*2;if(keys.ArrowRight||keys.d)px=S.hx+300*dt*2;S.hx+=(Math.max(28,Math.min(W-28,px))-S.hx)*Math.min(1,dt*14)}
 function step(dt){S.t+=dt;fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<0.8);if(S.inv>0)S.inv-=dt;
  if(cfg.time&&cfg.t!=="quiz"&&S.t>=cfg.time){end(cfg.goal?S.score>=cfg.goal:true);return}
  if(cfg.t==="catch"||cfg.t==="dodge"){moveHero(dt);const hy=H-80;
   if(cfg.t==="catch")spawnFall(dt,0.9,cfg.good,0.25);else{spawnFall(dt,0.55,cfg.bad,1);S.score+=dt}
   S.items.forEach(it=>{it.y+=it.v*dt;if(!it.hit&&Math.abs(it.x-S.hx)<40&&Math.abs(it.y-hy)<36){it.hit=1;
     if(it.bad){if(S.inv<=0){S.lives--;S.inv=1;fx.push({x:it.x,y:hy-40,t:0,s:"💥"})}}else{S.score++;fx.push({x:it.x,y:hy-40,t:0,s:"+1"})}}});
   S.items=S.items.filter(it=>!it.hit&&it.y<H+40);
   if(S.lives<=0){end(false);return}if(cfg.goal&&S.score>=cfg.goal&&!cfg.time){end(true);return}}
  else if(cfg.t==="runner"){const v=260*sp*(1+S.t/60);S.dist+=v*dt;S.score=Math.floor(S.dist/10)+(S.bonus||0);
   if(S.y<0||S.vy<0){S.vy+=1700*dt;S.y+=S.vy*dt;if(S.y>=0){S.y=0;S.vy=0}}
   S.spawn-=dt;if(S.spawn<=0){S.spawn=(1.1+Math.random()*1.2)/sp;const air=Math.random()<0.35;S.items.push({x:W+30,y:air?S.ground-130:S.ground,e:air?rnd(cfg.good):rnd(cfg.obst),bad:!air})}
   const hx=80,hy=S.ground+S.y;S.items.forEach(it=>{it.x-=v*dt;if(!it.hit&&Math.abs(it.x-hx)<30&&Math.abs(it.y-hy)<34){it.hit=1;
     if(it.bad){if(S.inv<=0){S.lives--;S.inv=1.2;fx.push({x:hx,y:hy-40,t:0,s:"💥"})}}else{S.bonus=(S.bonus||0)+25;fx.push({x:hx,y:hy-50,t:0,s:"+25"})}}});
   S.items=S.items.filter(it=>!it.hit&&it.x>-40);if(S.lives<=0){end(false);return}if(cfg.goal&&S.score>=cfg.goal){end(true);return}}
  else if(cfg.t==="clicker"){S.score+=S.auto*dt;if(cfg.goal&&S.score>=cfg.goal){end(true);return}}
  else if(cfg.t==="quiz"){if(S.wait>0){S.wait-=dt;if(S.wait<=0){S.pick=-1;S.qi++;if(S.qi>=cfg.qs.length){S.score=S.ok;end(S.ok/cfg.qs.length*100>=(cfg.goal||0));return}}}}}
 function wrap(t,x,y,maxW,lh,size,w){g.font=TF(size,w);const words=String(t).split(/\s+/);let line="",ly=y;for(const wd of words){const tt=line?line+" "+wd:wd;if(g.measureText(tt).width>maxW&&line){g.fillText(line,x,ly);line=wd;ly+=lh}else line=tt}g.fillText(line,x,ly);return ly}
 function btn(x,y,w,h,txt,fill,color){g.fillStyle=fill;g.beginPath();g.roundRect?g.roundRect(x,y,w,h,12):g.rect(x,y,w,h);g.fill();g.fillStyle=color||"#fff";g.textAlign="center";g.textBaseline="middle";wrap(txt,x+w/2,y+h/2,w-20,20,17,600)}
 function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,cfg.bg1);gr.addColorStop(1,cfg.bg2);g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.textAlign="center";g.textBaseline="middle";
  if(st==="menu"){g.fillStyle="#fff";g.font=F(96);g.fillText(cfg.hero,W/2,210);g.fillStyle="#fff";wrap(cfg.title,W/2,330,W-40,34,30,800);g.fillStyle="rgba(255,255,255,.75)";wrap(T[cfg.t].d,W/2,400,W-60,22,15,400);
   btn(60,470,W-120,56,cfg.startText,cfg.accent,"#1A1306");if(best){g.fillStyle="rgba(255,255,255,.7)";g.font=TF(14);g.fillText("Ваш рекорд: "+best,W/2,560)}return}
  if(st==="play"){
   if(cfg.t==="catch"||cfg.t==="dodge"){S.items.forEach(it=>{g.fillStyle="#fff";g.font=F(38);g.fillText(it.e,it.x,it.y)});g.globalAlpha=S.inv>0&&Math.floor(S.inv*10)%2?0.4:1;g.fillStyle="#fff";g.font=F(56);g.fillText(cfg.hero,S.hx,H-80);g.globalAlpha=1}
   else if(cfg.t==="runner"){g.fillStyle="rgba(255,255,255,.18)";g.fillRect(0,S.ground+28,W,3);S.items.forEach(it=>{g.fillStyle="#fff";g.font=F(42);g.fillText(it.e,it.x,it.y)});g.globalAlpha=S.inv>0&&Math.floor(S.inv*10)%2?0.4:1;g.fillStyle="#fff";g.font=F(52);g.fillText(cfg.hero,80,S.ground+S.y);g.globalAlpha=1}
   else if(cfg.t==="clicker"){const pulse=1+Math.sin(S.t*4)*0.03;g.fillStyle="#fff";g.font=F(130*pulse);g.fillText(cfg.target,W/2,250);g.fillStyle="#fff";g.font=TF(30,800);g.fillText(Math.floor(S.score).toLocaleString("ru-RU"),W/2,110);
    g.font=TF(13);g.fillStyle="rgba(255,255,255,.7)";g.fillText("за нажатие: "+S.power+" · в секунду: "+S.auto,W/2,145);
    cfg.ups.forEach((u,i)=>{const y=420+i*52,price=Math.ceil(u.p*Math.pow(1.6,S.owned[i])),can=S.score>=price;g.fillStyle=can?"rgba(255,255,255,.16)":"rgba(255,255,255,.06)";g.beginPath();g.roundRect?g.roundRect(20,y,W-40,46,10):g.rect(20,y,W-40,46);g.fill();
     g.textAlign="left";g.fillStyle="#fff";g.font=F(24);g.fillText(u.e,32,y+24);g.fillStyle=can?"#fff":"rgba(255,255,255,.5)";g.font=TF(14,600);g.fillText(u.n+(S.owned[i]?" ×"+S.owned[i]:""),66,y+16);g.font=TF(12);g.fillText((u.k==="auto"?"+"+u.v+" в секунду":"+"+u.v+" за нажатие"),66,y+33);
     g.textAlign="right";g.fillStyle=can?cfg.accent:"rgba(255,255,255,.4)";g.font=TF(15,800);g.fillText(price.toLocaleString("ru-RU"),W-32,y+24);g.textAlign="center"})}
   else if(cfg.t==="quiz"){const q=cfg.qs[S.order[S.qi]];g.fillStyle="rgba(255,255,255,.6)";g.font=TF(14);g.fillText("Вопрос "+(S.qi+1)+" из "+cfg.qs.length,W/2,90);g.fillStyle="#fff";g.font=F(54);g.fillText(cfg.hero,W/2,160);
    g.fillStyle="#fff";wrap(q.q,W/2,230,W-48,28,22,700);
    q.a.forEach((a,i)=>{const y=330+i*66;let f="rgba(255,255,255,.12)";if(S.pick>=0){if(i===q.c)f="#2E9E65";else if(i===S.pick)f="#C0303B"}btn(24,y,W-48,56,a,f)})}
   g.textAlign="center";fx.forEach(f=>{g.globalAlpha=1-f.t/0.8;g.fillStyle="#fff";g.font=/\d/.test(f.s)?TF(22,800):F(30);g.fillText(f.s,f.x,f.y-f.t*50)});g.globalAlpha=1;
   g.fillStyle="#fff";g.font=TF(16,700);g.textAlign="left";if(cfg.t!=="clicker"&&cfg.t!=="quiz")g.fillText("Очки: "+Math.floor(S.score)+(cfg.goal?" / "+cfg.goal:""),14,28);
   g.textAlign="right";if(cfg.t!=="clicker"&&cfg.t!=="quiz")g.fillText((cfg.time?"⏱ "+Math.max(0,Math.ceil(cfg.time-S.t))+"  ":"")+"❤️".repeat(Math.max(0,Math.min(S.lives,9))),W-14,28);g.textAlign="center";return}
  g.fillStyle="#fff";g.font=F(90);g.fillText(st==="win"?"🏆":"😵",W/2,200);g.fillStyle="#fff";wrap(st==="win"?cfg.winText:cfg.loseText,W/2,300,W-40,30,24,800);
  g.font=TF(18);g.fillStyle="rgba(255,255,255,.85)";g.fillText(cfg.t==="quiz"?"Верно: "+S.ok+" из "+cfg.qs.length:"Очки: "+Math.floor(S.score)+(best?" · рекорд: "+best:""),W/2,380);btn(60,440,W-120,56,"Ещё раз",cfg.accent,"#1A1306")}

<style>
:root{--bg:#0B0A0E;--panel:#16141B;--fg:#F4F4F6;--muted:#B9B6C2;--red:#E8333F;--gold:#E7BD52;--green:#4ADE95;--line:rgba(255,255,255,.12);color-scheme:dark}

h1{font:900 clamp(1.5rem,6vw,2.2rem)/1.1 Rubik,sans-serif;margin:6px 0 0}h1 b{color:var(--red)}h2{font:800 1.2rem Rubik,sans-serif;margin:0}
.lead,.muted{color:var(--muted);margin:0}.muted{font-size:.88rem}
.bar{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#F6DE8D);transition:width .3s}
.nav{display:flex;gap:6px;flex-wrap:wrap}.nav span{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font:600 .8rem "Golos Text";color:var(--muted)}
.nav span.cur{border-color:var(--gold);color:var(--gold)}.nav span.ok{border-color:rgba(74,222,149,.6);color:var(--fg)}.nav span.ok::before{content:"✓ ";color:var(--green)}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
label.f{display:grid;gap:4px;font-weight:600;font-size:.92rem}
input,select,textarea{background:#0F0E13;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:400 1rem "Golos Text";width:100%}
textarea{min-height:90px;resize:vertical}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}.ck input{width:20px;height:20px;flex:none;accent-color:#E7BD52;margin-top:2px}
.checks{display:grid;gap:4px;background:#0F0E13;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.9rem}
