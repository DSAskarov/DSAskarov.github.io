 fetch("https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av?a=u",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"whoami",token:t})}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.named&&j.nick){localStorage.setItem("iigry-nick",j.nick);localStorage.setItem("iigry-nick-ts",String(Date.now()))}}).catch(()=>{})}catch(_){}})();
/* Приложение: офлайн-режим и кнопка «Установить» (Android, Chrome, Яндекс Браузер) */
(function(){try{if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{})}catch(_){}
 addEventListener("beforeinstallprompt",e=>{e.preventDefault();try{if(localStorage.getItem("iigry-pwa-no"))return}catch(_){}const b=document.createElement("div");b.id="iigry-pwa";
  b.style.cssText="position:fixed;left:12px;bottom:12px;z-index:2147482000;display:flex;gap:6px;align-items:center;background:#16141B;border:1px solid #E7BD52;border-radius:999px;padding:6px 6px 6px 14px;color:#F4F4F6;font:600 13px 'Golos Text',system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4)";
  b.innerHTML='<span>📲 ИИгры как приложение</span><button type="button" style="border:0;border-radius:999px;background:#E7BD52;color:#1A1306;font:700 13px inherit;padding:8px 12px;cursor:pointer">Установить</button><button type="button" aria-label="Скрыть" style="border:0;background:transparent;color:#B9B6C2;font-size:16px;cursor:pointer;padding:4px 8px">✕</button>';
  b.children[1].onclick=async()=>{b.remove();e.prompt();try{await e.userChoice}catch(_){}};b.children[2].onclick=()=>{b.remove();try{localStorage.setItem("iigry-pwa-no","1")}catch(_){}};document.body.append(b)})})();
</script>
