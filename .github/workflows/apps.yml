# Сборка приложений «ИИгр»: APK для Android и установщики для Windows.
# Готовые файлы выкладываются в релиз «apps» — ссылки на сайте всегда ведут на последнюю версию.
name: Приложения (APK и установщики)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["games/**", "index.html", "tools/apps/**", ".github/workflows/apps.yml"]
permissions:
  contents: write
  id-token: write
concurrency: { group: apps, cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { slug: [iigry, pulsar, zhezl, s-nulya, kontinenty, lovi-bagi, kot-na-orbite, ferma-slov, origami] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: python3 tools/apps/gen.py ${{ matrix.slug }} ${{ github.run_number }}
      - run: gradle assembleRelease assembleDebug --no-daemon -q
        working-directory: build/${{ matrix.slug }}/android
      - name: Подпись ключом владельца (ключ выдаёт сервер только этой сборке)
        env: { SLUG: "${{ matrix.slug }}" }
        run: |
          set -e; mkdir -p out; O=build/$SLUG/android/app/build/outputs/apk
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=iigry-sign" | jq -r .value)
          echo "::add-mask::$JWT"
          R=$(curl -sS -X POST -H "Content-Type: application/json" -d "{\"jwt\":\"$JWT\"}" "https://functions.yandexcloud.net/d4enbk0c6huhltqsm5av?a=signkey" || echo '{}')
          export PW=$(echo "$R" | jq -r '.pw // empty' | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'); echo "::add-mask::$PW"
          if [ -n "$PW" ]; then
            echo "$R" | jq -r .p12 | base64 -d > "$RUNNER_TEMP/k.p12"; AL=$(echo "$R" | jq -r '.alias // "iigry"')
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -f -p 4 $O/release/app-release-unsigned.apk "$RUNNER_TEMP/a.apk"
            $BT/apksigner sign --ks "$RUNNER_TEMP/k.p12" --ks-type PKCS12 --ks-key-alias "$AL" --ks-pass env:PW --key-pass env:PW --out out/$SLUG.apk "$RUNNER_TEMP/a.apk"
            $BT/apksigner verify out/$SLUG.apk; rm -f "$RUNNER_TEMP/k.p12"; echo "Подписано ключом владельца"
          else
            cp $O/debug/app-debug.apk out/$SLUG.apk; echo "::warning::Ключ подписи не загружен в админ-панель — APK подписан тестовым ключом"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.slug }}
          path: out/*.apk
  windows:
    runs-on: windows-latest
    env: { PYTHONUTF8: "1" }
    strategy:
      fail-fast: false
      matrix: { slug: [iigry, pulsar, zhezl, s-nulya, kontinenty, lovi-bagi, kot-na-orbite, ferma-slov, origami] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python tools/apps/gen.py ${{ matrix.slug }} ${{ github.run_number }}
      - run: npm install --no-save --no-audit --no-fund electron@31.7.7 electron-builder@24.13.3
        working-directory: build/${{ matrix.slug }}/electron
      - run: npx electron-builder --win nsis --x64 --publish never
        working-directory: build/${{ matrix.slug }}/electron
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - run: mkdir out & copy build\${{ matrix.slug }}\electron\dist\${{ matrix.slug }}-setup.exe out\
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.slug }}
          path: out/*.exe
  rustore:
    # Неподписанный релизный APK приложения сайта — подписывается ключом владельца и загружается в RuStore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: python3 tools/apps/gen.py iigry ${{ github.run_number }}
      - run: gradle assembleRelease --no-daemon -q
        working-directory: build/iigry/android
      - uses: actions/upload-artifact@v4
        with:
          name: rustore-unsigned
          path: build/iigry/android/app/build/outputs/apk/release/*.apk
  release:
    needs: [android, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: "apk-*", merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: "win-*", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: Приложения «ИИгры онлайн»
          body: "APK для Android и установщики для Windows. Обновляются автоматически при каждом обновлении игр. Сборка №${{ github.run_number }}."
          files: out/*
          make_latest: true
